<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #0b1020; color: #e8ecf8; }
    .wrap { padding: 14px; }
    h1 { font-size: 1.05rem; margin: 0 0 8px; } h1 b { color: #ff5d3b; }
    label { display: block; font-size: .8rem; color: #9aa7c7; margin: 8px 0 3px; }
    input { width: 100%; box-sizing: border-box; background: #111933; color: #e8ecf8; border: 1px solid #27345f; border-radius: 8px; padding: 8px; }
    .btn { background: #ff5d3b; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn.sec { background: #1b2850; border: 1px solid #27345f; }
    .badge { display: inline-block; background: #1b2850; border: 1px solid #27345f; border-radius: 999px; padding: 3px 10px; font-size: .8rem; color: #ffb03b; font-weight: 700; }
    .muted { color: #9aa7c7; font-size: .78rem; }
    .err { color: #ff6b7a; font-size: .82rem; margin-top: 8px; }
    .ok { color: #37d08a; font-size: .82rem; margin-top: 8px; }
    .out { background: #111933; border: 1px solid #27345f; border-radius: 8px; padding: 8px; margin-top: 10px; max-height: 260px; overflow: auto; font-size: .82rem; }
    .out table { width: 100%; border-collapse: collapse; }
    .out td { padding: 3px 4px; border-bottom: 1px solid #27345f; }
    a { color: #ffb03b; }
    .rowb { display: flex; gap: 8px; } .rowb .btn { margin-top: 8px; }
    .ver { font-size: .7rem; color: #9aa7c7; font-weight: 400; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: .76rem; }
    h1 { display: flex; align-items: baseline; gap: 6px; }
    #msg .ok, #msg .err, #msg .muted, #msg .out { margin-top: 8px; font-size: .82rem; }
    #msg .ok { color: #37d08a; } #msg .err { color: #ff6b7a; } #msg .muted { color: #9aa7c7; }
    #msg .out { background: #111933; border: 1px solid #27345f; border-radius: 8px; padding: 8px; }
    .sw { margin-top: 6px; } .sw label { display: flex; gap: 8px; align-items: center; color: #e8ecf8; font-size: .82rem; margin: 0; cursor: pointer; }
    .sw input { width: auto; margin: 0; accent-color: #ff5d3b; }
    .warn { background: #2a2210; border: 1px solid #ffcf5c; color: #ffcf5c; border-radius: 8px; padding: 6px 8px; font-size: .8rem; margin: 6px 0; }
  </style>
</head>
<body>
  <div class="wrap" id="root">Carregando…</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
