<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 348px; margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #0b1020; color: #e8ecf8; }
    .wrap { padding: 13px; }
    h1 { font-size: 1.02rem; margin: 0 0 6px; display: flex; align-items: baseline; gap: 6px; }
    h1 b { color: #ff5d3b; }
    .ver { font-size: .7rem; color: #9aa7c7; font-weight: 400; }
    label { display: block; font-size: .8rem; color: #9aa7c7; margin: 10px 0 3px; }
    input[type=text] { width: 100%; box-sizing: border-box; background: #111933; color: #e8ecf8; border: 1px solid #27345f; border-radius: 8px; padding: 8px; }
    .btn { background: #ff5d3b; color: #fff; border: 0; border-radius: 8px; padding: 8px 10px; font-weight: 700; font-size: .82rem; cursor: pointer; width: 100%; margin-top: 8px; font-family: inherit; }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn.sec { background: #1b2850; border: 1px solid #27345f; }
    .rowb { display: flex; gap: 8px; }
    .badge { display: inline-block; background: #1b2850; border: 1px solid #27345f; border-radius: 999px; padding: 3px 10px; font-size: .8rem; color: #ffb03b; font-weight: 700; }
    .muted { color: #9aa7c7; font-size: .78rem; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: .74rem; }
    .err { color: #ff6b7a; font-size: .8rem; } .ok { color: #37d08a; font-size: .8rem; }
    .warn { background: #2a2210; border: 1px solid #ffcf5c; color: #ffcf5c; border-radius: 8px; padding: 6px 8px; font-size: .78rem; margin: 6px 0; }
    .conta { background: #151f3d; border: 1px dashed #3b55a8; border-radius: 10px; padding: 8px; margin: 6px 0; font-size: .8rem; }
    .out { background: #111933; border: 1px solid #27345f; border-radius: 8px; padding: 8px; margin-top: 8px; max-height: 240px; overflow: auto; font-size: .8rem; }
    .out table { width: 100%; border-collapse: collapse; }
    .out td { padding: 3px 4px; border-bottom: 1px solid #27345f; }
    .sw label { display: flex; gap: 8px; align-items: center; color: #e8ecf8; font-size: .82rem; margin: 6px 0 0; cursor: pointer; }
    .sw input { width: auto; margin: 0; accent-color: #ff5d3b; }
    a { color: #ffb03b; }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
